version: "3.8"

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:6.0
    container_name: gencanvas_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: gencanvas
    volumes:
      - mongodb_data:/data/db
    networks:
      - gencanvas_network

  # Express Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gencanvas_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - MONGODB_URL=mongodb://mongodb:27017/gencanvas
      - JWT_SECRET=gencanvas_super_secret_jwt_key_2026
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost
    depends_on:
      - mongodb
    networks:
      - gencanvas_network

  # Vite + React Frontend Service
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gencanvas_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - gencanvas_network

volumes:
  mongodb_data:
    driver: local

networks:
  gencanvas_network:
    driver: bridge
